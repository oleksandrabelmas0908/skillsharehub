version: '3'

services:

  backend:
    container_name: backend
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile 
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/skillsharehub
    ports:
      - "8000:8000"

    
  postgres:
    image: postgres:16
    container_name: postgres
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d skillsharehub"]
      interval: 5s
      timeout: 3s
      retries: 5


volumes:
  postgres_data: